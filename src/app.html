<!doctype html>
<html lang="%portfolio.language%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/MonaSansVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <style>
      @font-face {
        font-family: "Mona Sans";
        src: url("%sveltekit.assets%/fonts/MonaSansVariable.woff2") format("woff2");
        font-weight: 200 900;
        font-style: normal;
        font-display: block;
      }

      @font-face {
        font-family: "Mona Sans";
        src: url("%sveltekit.assets%/fonts/MonaSansVariable-Italic.woff2") format("woff2");
        font-weight: 200 900;
        font-style: italic;
        font-display: block;
      }
    </style>
    <script>
      (() => {
        document.documentElement.classList.add("js");
        const storageKey = "theme";
        const legacyStorageKey = "docs-theme";
        const storedTheme = localStorage.getItem(storageKey);
        const legacyStoredTheme = localStorage.getItem(legacyStorageKey);
        const resolvedTheme = storedTheme ?? legacyStoredTheme;

        if (!storedTheme && (legacyStoredTheme === "light" || legacyStoredTheme === "dark")) {
          localStorage.setItem(storageKey, legacyStoredTheme);
          localStorage.removeItem(legacyStorageKey);
        }

        const isDark =
          resolvedTheme === "dark" ||
          (resolvedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
